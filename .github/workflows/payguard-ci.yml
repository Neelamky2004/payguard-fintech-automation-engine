name: PayGuard Enterprise CI/CD Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fintech-regression:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up Chrome
      uses: browser-actions/setup-chrome@v1

    - name: Run Maven Regression Suite
      run: mvn clean test
