name: PayGuard Enterprise CI/CD Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fintech-regression:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run Headless FinTech Test Suite
      run: mvn clean test -Dheadless=true

    - name: Upload PayGuard Executive HTML Report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: PayGuard-Executive-Report
        path: reports/
